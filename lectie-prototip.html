<!DOCTYPE html>
<html lang="ro" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lecție (prototip) | Teorema</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/premium.css">
  <link rel="stylesheet" href="css/owl.css">
  <link rel="stylesheet" href="css/lectie.css">
  <script src="js/theme.js"></script>
  <script src="js/mascot.js"></script>
</head>
<body class="pm lz">

  <header class="lz-top">
    <button class="lz-x" id="lzExit" type="button" aria-label="Ieși din lecție" title="Ieși din lecție">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lz-prog" role="progressbar" aria-label="Progres lecție" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="lzProg"><i id="lzBar"></i></div>
    <div class="lz-xp" title="Puncte câștigate în lecție"><img src="assets/images/gamification/streak-mini.svg" alt="" width="22" height="22"><b id="lzXp">0</b><span>XP</span></div>
  </header>

  <main class="lz-main" id="lzMain" aria-live="polite"></main>

  <footer class="lz-foot" id="lzFoot">
    <div class="lz-foot__in">
      <div class="lz-fb" id="lzFb" hidden>
        <div class="lz-fb__owl owl" id="lzFbOwl"></div>
        <div class="lz-fb__tx"><b id="lzFbTitle"></b><span id="lzFbText"></span></div>
      </div>
      <button class="lz-skip" id="lzSkip" type="button">Nu știu</button>
      <button class="lz-go" id="lzGo" type="button" disabled>Verifică</button>
    </div>
  </footer>

  <div class="lz-tag">Prototip · conținut exemplu, de validat</div>

  <script src="js/lectie-prototip.js"></script>
</body>
</html>
