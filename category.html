<!DOCTYPE html>
<html lang="ro" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitol — Mathorizon</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="js/theme.js"></script>
  <script src="js/page-transition.js"></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="nav" id="nav-root"></nav>
  <script src="js/icons.js"></script>
  <script src="js/nav-loader.js"></script>

  <!-- CATEGORY HEADER -->
  <div class="cat-header" id="catHeader">
    <div class="container">
      <div class="cat-header__inner">
        <div class="cat-header__icon" style="opacity:0.3">…</div>
        <div class="cat-header__info">
          <div class="loading-card" style="height:24px;width:200px;margin-bottom:8px"></div>
          <div class="loading-card" style="height:16px;width:300px"></div>
        </div>
      </div>
    </div>
  </div>


  <!-- Category breadcrumb (cards view only) -->
  <div class="subcat-breadcrumb" id="catBreadcrumb" style="display:none">
    <div class="container">
      <div class="subcat-bc__inner">
        <a class="subcat-bc__back" href="index.html"><svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg> Capitole</a>
        <span class="subcat-bc__sep">›</span>
        <span class="subcat-bc__current" id="catBreadcrumbName"></span>
      </div>
    </div>
  </div>

  <!-- VIEW: Subcategory Cards -->
  <div id="subcatCardsSection" class="main container">
    <div class="main-blob main-blob--pink" aria-hidden="true"></div>
    <div class="main-blob main-blob--blue" aria-hidden="true"></div>
    <div class="subcat-cards-grid" id="subcatCardsGrid">
      <div class="loading-card" style="height:140px"></div>
      <div class="loading-card" style="height:140px"></div>
      <div class="loading-card" style="height:140px"></div>
      <div class="loading-card" style="height:140px"></div>
    </div>
  </div>

  <!-- VIEW: Exercises (hidden until subcategory selected) -->
  <div id="exercisesSection" style="display:none">

    <!-- Sticky breadcrumb -->
    <div class="subcat-breadcrumb" id="subcatBreadcrumb">
      <!-- Injected by JS -->
    </div>

    <!-- Filter + Exercises -->
    <main class="main container">
      <div class="filter-bar" id="filterBar"></div>
      <div class="exercises-container" id="exercisesContainer">
        <div class="loading-card" style="height:80px"></div>
        <div class="loading-card" style="height:80px"></div>
        <div class="loading-card" style="height:80px"></div>
      </div>
    </main>

  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="BM.closeAllPanels()"></div>

  <!-- PANEL: Favorites -->
  <aside class="panel" id="panel-fav">
    <div class="panel__head">
      <h3>Favorite în capitol</h3>
      <button class="icon-btn" onclick="BM.closeAllPanels()"><svg class="icon icon-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <div class="panel__body" id="favList"></div>
  </aside>

  <!-- PANEL: Istoric -->
  <aside class="panel" id="panel-hist">
    <div class="panel__head">
      <h3>Istoric Rezolvări</h3>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn btn--surface" style="font-size:0.75rem;padding:4px 10px;height:32px" onclick="clearHistory()" title="Șterge istoricul">Șterge tot</button>
        <button class="icon-btn" onclick="BM.closeAllPanels()" title="Închide"><svg class="icon icon-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </div>
    </div>
    <div class="panel__body" id="histList">
      <div class="empty-state">
        <div class="empty-icon"><svg class="icon icon-48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></div>
        <p>Nu ai rezolvat niciun exercițiu.</p>
        <p class="text-muted">Exercițiile rezolvate vor apărea aici.</p>
      </div>
    </div>
  </aside>

  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Înapoi sus" title="Înapoi sus"><svg class="icon icon-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/custom-exercises.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
